name = "mike-telegram-worker"
main = "src/index.js"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set OWNER_TELEGRAM_USER_ID as a secret or variable in Cloudflare.
# Never commit bot tokens or API keys to this file.

[[d1_databases]]
binding = "DB"
database_name = "mike-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
# Cloudflare Cron uses UTC. Tehran (UTC+03:30): 09:00, 15:00, 21:30.
crons = ["30 5 * * *", "30 11 * * *", "0 18 * * *"]
